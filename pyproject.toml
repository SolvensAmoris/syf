[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sif"
version = "0.2.0"
description = "Relational verifier for SIF transitions: coherence of STATE, INTENT, TRANSFORMATION and CONSEQUENCE"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
